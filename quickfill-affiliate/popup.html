<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
  <title>QuickFill Affiliate</title>
</head>
<body>
  <header class="bar">
    <div class="brand">
      <img src="icons/icon48.png" alt="" width="20" height="20">
      <span>QuickFill <b>Affiliate</b></span>
    </div>
    <button id="openOptions" class="icon-btn" title="Options" aria-label="Open options">
      <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
        <path fill="currentColor" d="M19.14 12.94a7.07 7.07 0 0 0 0-1.88l2.03-1.58a.5.5 0 0 0 .12-.64l-1.92-3.32a.5.5 0 0 0-.6-.22l-2.39.96a7.03 7.03 0 0 0-1.62-.94l-.36-2.54a.5.5 0 0 0-.5-.42h-3.84a.5.5 0 0 0-.5.42l-.36 2.54c-.58.24-1.12.56-1.62.94l-2.39-.96a.5.5 0 0 0-.6.22L2.67 8.84a.5.5 0 0 0 .12.64l2.03 1.58a7.07 7.07 0 0 0 0 1.88l-2.03 1.58a.5.5 0 0 0-.12.64l1.92 3.32c.13.22.39.31.6.22l2.39-.96c.5.38 1.04.7 1.62.94l.36 2.54c.04.24.25.42.5.42h3.84c.25 0 .46-.18.5-.42l.36-2.54c.58-.24 1.12-.56 1.62-.94l2.39.96c.22.09.47 0 .6-.22l1.92-3.32a.5.5 0 0 0-.12-.64l-2.03-1.58ZM12 15.5A3.5 3.5 0 1 1 12 8.5a3.5 3.5 0 0 1 0 7Z"/>
      </svg>
    </button>
  </header>

  <main>
    <div id="detected" class="detected">
      <span class="count" id="count">–</span>
      <span class="count-label" id="countLabel">scanning this page…</span>
    </div>

    <button id="fill" class="btn primary">Fill This Form</button>
    <button id="highlight" class="btn secondary">Fill &amp; Highlight Only</button>

    <p id="status" class="status" hidden></p>
    <ul id="frames" class="frames" hidden></ul>

    <div class="footer">
      <span class="profile">Profile: <b id="profileName">–</b></span>
      <span class="hint" id="shortcutHint">Ctrl+Shift+F</span>
    </div>
    <p class="never-submits">Never submits the form — review, then submit yourself.</p>
  </main>

  <script src="popup.js"></script>
</body>
</html>
